# Prometheus 配置 — DC-IOC 平台监控
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: dc-ioc
    env: ${APP_ENV:-dev}

# Alertmanager (按需启用)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# 告警规则
rule_files:
  - "rules/*.yml"

scrape_configs:
  # ---- DC-IOC Backend (FastAPI + Prometheus metrics) ----
  - job_name: dc-ioc-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: dc-ioc-backend
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "dc-ioc-${1}"

  # ---- Node Exporter (主机指标) ----
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  # ---- PostgreSQL Exporter ----
  # - job_name: postgres-exporter
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
  #       labels:
  #         service: postgres

  # ---- Redis Exporter ----
  # - job_name: redis-exporter
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
  #       labels:
  #         service: redis

  # ---- Prometheus 自监控 ----
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
