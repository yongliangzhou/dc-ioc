# Docker Compose 开发环境覆盖
# 用法: docker compose -f docker-compose.yml -f deploy/docker-compose.dev.yml up
version: "3.9"

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      target: dev
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      LOG_LEVEL: DEBUG
      EXTERNAL_MOCK_COLLECTOR_ENABLED: "true"
      # 阶段 3 · 1.5 Kafka 接入演示: 配置后 Mock 采集器与消费端经 Kafka 闭环
      EXTERNAL_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      # AI 运维助手大模型接入（兼容 OpenAI / 通义 / 本地 vLLM 等任意 OpenAI 接口）。
      # 留空(默认)则不启用，自动回退本地知识库检索生成；填入后即有自然语言问答。
      # 可通过 shell 环境变量或同目录 .env 文件注入，例如:
      #   LLM_API_KEY=sk-xxxx
      #   LLM_BASE_URL=https://api.openai.com/v1
      #   LLM_MODEL=gpt-4o-mini
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - kafka

  kafka:
    # Apache 官方免费镜像 (Bitnami 已转订阅制), 单节点 KRaft 模式
    image: apache/kafka:3.7.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      target: dev
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  # Prometheus (仅开发)
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - backend

volumes:
  backend-venv:
