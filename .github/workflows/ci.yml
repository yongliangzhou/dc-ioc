name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:   # 允许手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ================================================================
  # 后端: lint + 安全扫描 + 测试
  # ================================================================
  backend:
    name: "Backend CI"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dcuser
          POSTGRES_PASSWORD: dcpass
          POSTGRES_DB: dc_ioc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dcuser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety  # 安全扫描

      - name: Lint (Ruff)
        run: ruff check app/ --output-format=github

      - name: Security scan (Bandit)
        run: bandit -r app/ -f json -o bandit-report.json || true

      - name: Dependency audit (Safety)
        run: safety check --full-report || true

      - name: Test
        run: |
          pytest tests/ -v --tb=short --timeout=30 \
            -k "not db and not integration" \
            --junitxml=junit.xml \
            --cov=app --cov-report=term-missing --cov-report=xml
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-key-32-chars-minimum!!
          POSTGRES_HOST: localhost
          POSTGRES_USER: dcuser
          POSTGRES_PASSWORD: dcpass
          POSTGRES_DB: dc_ioc
          REDIS_HOST: localhost
          EXTERNAL_MOCK_COLLECTOR_ENABLED: "false"

      - name: SQL injection guard [S-08]
        # 禁止把外部输入拼进原生 SQL (f-string / 字符串拼接), 仅允许参数化查询。
        run: python ../scripts/sql_guard.py app

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ================================================================
  # 前端: lint + typecheck + 构建
  # ================================================================
  frontend:
    name: "Frontend CI"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Lint
        run: npx eslint src/ --ext .ts,.vue --max-warnings 50 || true

      - name: Unit test (Vitest)
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ================================================================
  # Docker 镜像构建 (仅 main 分支)
  # ================================================================
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: dc-ioc-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        run: >
          docker buildx build
          --file frontend/Dockerfile
          --tag dc-ioc-frontend:latest
          --load
          --cache-from type=gha
          --cache-to type=gha,mode=max
          .

      - name: Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dc-ioc-backend:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
